name: Build and Publish

# OIDC trusted publishing to npm (no token required)
permissions:
  contents: read
  id-token: write

# Releases come from main only. An unrestricted `push:` let any branch publish
# the `latest` dist-tag: a commit whose message starts with "release", pushed to
# a throwaway branch, was enough to ship that branch's build to every consumer.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One group per commit: a shared group keeps a single pending run, so a third
# release pushed while the first publishes would silently drop the second.
# Ordering between releases is handled at the dist-tag instead (see Publish).
concurrency:
  group: publish-demosdk-${{ github.sha }}
  cancel-in-progress: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        # `head_commit` is null outside `push`, so a manual dispatch evaluates to
        # false and publishes nothing — the branch guard above is the boundary
        # that matters, this stays as the release-intent marker.
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release')
        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
              with:
                  bun-version: latest
            - name: Setup Node (for npm publish via OIDC)
              uses: actions/setup-node@v4
              with:
                  node-version: '22.18.0'
                  registry-url: 'https://registry.npmjs.org'
            - name: Upgrade npm to >=11.5.1 (required for trusted publishing)
              run: npm install -g npm@11.5.1 && hash -r
            - name: Install dependencies
              run: bun install
            - name: Build package
              run: bun run build
            - name: Debug npm version
              run: npm --version
            - name: Publish 🎉
              # Releases run in parallel now, so one can finish after a newer
              # one. `latest` only moves forward: a version older than the
              # current `latest` still publishes, under `previous`. Compared
              # against the latest tag, not the highest version, because of the
              # orphan 6.0.1 on the registry.
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  CURRENT=$(npm view @kynesyslabs/demosdk dist-tags.latest 2>/dev/null || echo 0.0.0)
                  NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)
                  if [ "$NEWEST" = "$VERSION" ]; then TAG=latest; else TAG=previous; fi
                  echo "publishing $VERSION as $TAG (latest is $CURRENT)"
                  npm publish --provenance --access public --tag "$TAG"
