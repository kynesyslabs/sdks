name: Build and Publish

# OIDC trusted publishing to npm (no token required)
permissions:
  contents: read
  id-token: write

# Releases come from main only. An unrestricted `push:` let any branch publish
# the `latest` dist-tag: a commit whose message starts with "release", pushed to
# a throwaway branch, was enough to ship that branch's build to every consumer.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Two release pushes in a row must not race for the same dist-tag.
concurrency:
  group: publish-demosdk
  cancel-in-progress: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        # `head_commit` is null outside `push`, so a manual dispatch evaluates to
        # false and publishes nothing — the branch guard above is the boundary
        # that matters, this stays as the release-intent marker.
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release')
        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest
            - name: Setup Node (for npm publish via OIDC)
              uses: actions/setup-node@v4
              with:
                  node-version: '22.18.0'
                  registry-url: 'https://registry.npmjs.org'
            - name: Upgrade npm to >=11.5.1 (required for trusted publishing)
              run: npm install -g npm@11.5.1 && hash -r
            - name: Install dependencies
              run: bun install
            - name: Build package
              run: bun run build
            - name: Debug npm version
              run: npm --version
            - name: Publish 🎉
              # --tag latest forces dist-tag bypassing semver max-version check
              # (orphan 6.0.1 on registry would otherwise block latest assignment)
              run: npm publish --provenance --access public --tag latest
