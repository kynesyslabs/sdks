name: Packed Node ESM

permissions:
    contents: read

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    packed-esm:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node:
                    - "20.19.0"
                    - "22"
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest
            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ matrix.node }}
            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts
            - name: Test ESM rewriter safety
              run: npm run test:fix-esm
            - name: Build package
              run: bun run build
            - name: Test packed ESM consumer
              run: npm run test:package-esm
