name: Packed Node ESM

permissions: read-all

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    packed-esm:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node:
                    - "20.19.0"
                    - "22"
        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Test ESM rewriter safety
              run: npm run test:fix-esm
            - name: Build package
              run: bun run build
            - name: Test packed ESM consumer
              run: npm run test:package-esm
